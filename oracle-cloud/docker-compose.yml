version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nihonquest-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nihonquest_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-NihonQuestSecurePass2026!}
      POSTGRES_DB: ${POSTGRES_DB:-nihonquest}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    shm_size: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nihonquest_admin} -d ${POSTGRES_DB:-nihonquest}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

